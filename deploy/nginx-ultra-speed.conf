# Professional AI - Ultra Speed Nginx Configuration
# Optimized for maximum performance with CDN, caching, and compression

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ===================================================================
    # Basic Settings
    # ===================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # ===================================================================
    # Compression (Brotli + Gzip)
    # ===================================================================
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript application/wasm image/svg+xml;
    brotli_static on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # ===================================================================
    # Rate Limiting
    # ===================================================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    # ===================================================================
    # Cache Zones
    # ===================================================================
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:100m max_size=10g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:100m max_size=50g inactive=24h use_temp_path=off;

    # ===================================================================
    # Upstream Backend
    # ===================================================================
    upstream backend {
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ===================================================================
    # CDN Configuration
    # ===================================================================
    map $request_uri $cdn_enabled {
        default 0;
        ~^/static/ 1;
        ~^/_next/static/ 1;
        ~^/media/ 1;
        ~^/uploads/ 1;
    }

    # ===================================================================
    # Main Server
    # ===================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        # Redirect HTTP to HTTPS in production
        # return 301 https://$server_name$request_uri;

        # ===================================================================
        # Security Headers
        # ===================================================================
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ===================================================================
        # Client Settings
        # ===================================================================
        client_max_body_size 100M;
        client_body_buffer_size 128k;
        client_header_buffer_size 4k;
        large_client_header_buffers 4 8k;

        # ===================================================================
        # API Routes (with caching)
        # ===================================================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            
            # Caching for GET requests
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            
            # Compression
            gzip_static on;
        }

        # ===================================================================
        # Health Checks (no caching, no rate limiting)
        # ===================================================================
        location /api/health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            access_log off;
        }

        # ===================================================================
        # Login endpoint (stricter rate limiting)
        # ===================================================================
        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===================================================================
        # Static Assets (aggressive caching)
        # ===================================================================
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Cache-Status HIT always;
            
            # Try to serve compressed version
            gzip_static on;
            brotli_static on;
            
            # CDN header
            add_header CDN-Cache "HIT" always;
        }

        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Cache-Status HIT always;
            gzip_static on;
            brotli_static on;
        }

        # ===================================================================
        # Media Files (CDN + caching)
        # ===================================================================
        location /media/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Cache-Status HIT always;
            
            proxy_cache media_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating;
            
            # CDN header
            add_header CDN-Cache "HIT" always;
        }

        # ===================================================================
        # Frontend (SPA fallback)
        # ===================================================================
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Don't cache HTML
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ===================================================================
    # HTTPS Server (Production)
    # ===================================================================
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name _;
    #
    #     # SSL Configuration
    #     ssl_certificate /etc/letsencrypt/live/domain/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/domain/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HTTP/2 Server Push
    #     http2_push_preload on;
    #
    #     # Include same location blocks as HTTP server
    #     # ... (same as above)
    # }
}