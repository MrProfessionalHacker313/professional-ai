# Professional AI - Nginx Reverse Proxy Configuration
# SECURITY HARDENED: HTTPS, WAF, rate limiting, security headers, request validation

# Upstream backend
upstream backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=global:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    
    # SSL Configuration
    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    
    # Client body size limit
    client_max_body_size 50M;
    
    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;
    
    # Hide nginx version
    server_tokens off;
    
    # Global rate limiting
    limit_req zone=global burst=30 nodelay;
    
    # WAF rules - Block common attacks
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }
    
    # Block SQL injection attempts
    if ($args ~* "(select|union|insert|update|delete|drop|create|alter|exec|execute|script|iframe|javascript|onerror|onload|--|/\*)") {
        return 403;
    }
    
    # Block path traversal
    if ($uri ~* "\.\./|\.\.\\|/etc/passwd|/proc/self|/\.git/|\.env$") {
        return 403;
    }
    
    # Block command injection
    if ($args ~* "(;|\||`|\$\(|\$\{).*(cat|ls|rm|curl|wget|bash|sh|cmd|powershell|nc|netcat)") {
        return 403;
    }
    
    # Block SSRF attempts to internal services
    if ($args ~* "(localhost|127\.0\.0\.1|0\.0\.0\.0|169\.254\.169\.254|metadata\.google\.internal)") {
        return 403;
    }
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # Block access to sensitive files
    location ~ ~$ {
        deny all;
        return 404;
    }
    
    location ~ \.(env|git|htaccess|htpasswd|ini|log|conf|config|bak|backup|sql|pem|key|crt)$ {
        deny all;
        return 404;
    }
    
    # Backend API
    location /api/ {
        # Validate request body size
        if ($content_length > 52428800) {
            return 413;
        }
        
        limit_req zone=api burst=10 nodelay;
        
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Auth endpoints - stricter rate limiting
        location ~ ^/api/auth/(login|register|refresh|forgot-password|reset-password) {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://backend;
        }
        
        # Admin endpoints - stricter rate limiting
        location ~ ^/api/admin/ {
            limit_req zone=admin burst=5 nodelay;
            proxy_pass http://backend;
        }
        
        # Webhook endpoints - higher timeout (keep original signature header)
        location ~ ^/api/payments/(stripe|paypal)/webhook {
            proxy_set_header X-Original-Signature $http_stripe_signature;
            proxy_pass http://backend;
        }
    }
    
    # Metrics endpoint - requires auth
    location /metrics {
        limit_req zone=api burst=5 nodelay;
        auth_basic "Metrics";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://backend;
    }
    
    # Frontend static files
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Disable iframe embedding (clickjacking)
        add_header X-Frame-Options "DENY" always;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY" always;
    }
}