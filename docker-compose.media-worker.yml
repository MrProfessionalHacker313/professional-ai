# Docker Compose override for media-worker service
# Usage: docker compose -f docker-compose.yml -f docker-compose.media-worker.yml up media-worker
# NOTE: GPU is optional. Set NVIDIA_GPU_ENABLED=true to enable GPU reservations.
services:
  media-worker:
    build:
      context: ./media-worker
      dockerfile: Dockerfile
    volumes:
      - ./media-output:/app/media_output
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      - MEDIA_TIMEOUT_MS=${MEDIA_EXTERNAL_TIMEOUT_SECONDS:-10000}
      - MEDIA_WORKER_CONCURRENCY=${MEDIA_WORKER_CONCURRENCY:-8}
      - FAL_KEYS=${FAL_KEYS:-}
      - REPLICATE_KEYS=${REPLICATE_KEYS:-}
      - KLING_KEYS=${KLING_KEYS:-}
      - RUNWAY_KEYS=${RUNWAY_KEYS:-}
      - ELEVENLABS_KEYS=${ELEVENLABS_KEYS:-}
      - COMFYUI_URL=${COMFYUI_URL:-http://media-vault-gpu:8188}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_STORAGE_BUCKET=${GOOGLE_CLOUD_STORAGE_BUCKET:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-./service-account.json}
      - BACKEND_API_URL=http://backend:8000
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: '4'