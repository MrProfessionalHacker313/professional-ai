services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: professional_ai
      POSTGRES_USER: proai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proai_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/init-proai.sql:/docker-entrypoint-initdb.d/02-init-proai.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proai -d professional_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pro-ai-network
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2'

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pro-ai-network
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.0.0}
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://proai:${POSTGRES_PASSWORD:-proai_password}@postgres:5432/professional_ai
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-secure-random-key-at-least-32-characters}
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret-key-must-be-at-least-32-characters}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-32-byte-hex-key-for-aes-256-gcm}
      - INTERNAL_WORKER_SECRET=${INTERNAL_WORKER_SECRET:-change-this-internal-secret}
      - METRICS_PASSWORD=${METRICS_PASSWORD:-change-this-metrics-password-min-16-chars}
      - ENVIRONMENT=production
      - DB_SSL_MODE=prefer
      - OWNER_EMAIL=${OWNER_EMAIL:-redr28126@gmail.com}
      - OWNER_SETUP_KEY=${OWNER_SETUP_KEY:-change-this-owner-setup-key}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000,https://professionalai.com
      - FRONTEND_URL=http://localhost:8000
      - VAULT_LOG_ENABLED=${VAULT_LOG_ENABLED:-true}
      - UNLIMITED_PLANS=${UNLIMITED_PLANS:-pro,pro_yearly,max,business,enterprise,trial}
      - MEDIA_ENGINE_ENABLED=${MEDIA_ENGINE_ENABLED:-true}
      - MEDIA_EXTERNAL_TIMEOUT_SECONDS=${MEDIA_EXTERNAL_TIMEOUT_SECONDS:-10}
      - COMFYUI_URL=${COMFYUI_URL:-http://localhost:8188}
      - GOOGLE_CLOUD_STORAGE_BUCKET=${GOOGLE_CLOUD_STORAGE_BUCKET:-}
      - FAL_KEYS=${FAL_KEYS:-}
      - KLING_KEYS=${KLING_KEYS:-}
      - RUNWAY_KEYS=${RUNWAY_KEYS:-}
      - REPLICATE_KEYS=${REPLICATE_KEYS:-}
      - ELEVENLABS_KEYS=${ELEVENLABS_KEYS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - APPLE_CLIENT_SECRET=${APPLE_CLIENT_SECRET:-}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_KEYS=${GEMINI_KEYS:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_KEYS=${GROQ_KEYS:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_KEYS=${OPENROUTER_KEYS:-}
      - FAL_AI_API_KEY=${FAL_AI_API_KEY:-}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY:-}
      - KLING_API_KEY=${KLING_API_KEY:-}
      - RUNWAY_API_KEY=${RUNWAY_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
      - ./backend/.env:/app/.env:ro
      - ./backend/app:/app/app:delegated
      - ./database:/app/database:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pro-ai-network
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2'

  media-worker:
    image: node:20-alpine
    restart: always
    working_dir: /app/media-worker
    volumes:
      - ./media-worker:/app/media-worker
      - media_output:/app/media_output
      - media_temp:/app/data/media_temp
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - MEDIA_TIMEOUT_MS=${MEDIA_EXTERNAL_TIMEOUT_SECONDS:-10000}
      - MEDIA_WORKER_CONCURRENCY=8
      - FAL_KEYS=${FAL_KEYS:-}
      - REPLICATE_KEYS=${REPLICATE_KEYS:-}
      - KLING_KEYS=${KLING_KEYS:-}
      - RUNWAY_KEYS=${RUNWAY_KEYS:-}
      - ELEVENLABS_KEYS=${ELEVENLABS_KEYS:-}
      - FAL_API_URL=https://queue.fal.run
      - REPLICATE_API_URL=https://api.replicate.com/v1
      - KLING_API_URL=https://api.klingai.com
      - RUNWAY_API_URL=https://api.dev.runwayml.com/v1
      - ELEVENLABS_API_URL=https://api.elevenlabs.io/v1
      - COMFYUI_URL=${COMFYUI_URL:-http://localhost:8188}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_STORAGE_BUCKET=${GOOGLE_CLOUD_STORAGE_BUCKET:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-./service-account.json}
      - BACKEND_API_URL=http://backend:8000
    command: sh -c "npm install && npm start"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - pro-ai-network
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: '4'

  ai-engine:
    image: ollama/ollama:latest
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 24g
          cpus: '8'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - pro-ai-network
    profiles:
      - ai-engine

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  backend_logs:
  backend_uploads:
  media_output:
  media_temp:

networks:
  pro-ai-network:
    driver: bridge